interface:
  display_name: "Plexer Context Graph"
  short_description: "Offline code graph, caller tracing, blast radius, and symbol spans"
  default_prompt: "Use $plexer (`plexer read`, `plexer ask`, `plexer callers`, `plexer blast`, `plexer skeleton`, `plexer grep`, `plexer map`, `plexer health`) to locate symbols, read exact spans, trace callers, and scope edits before paging source files."
policy:
  allow_implicit_invocation: true
